  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#e8eaf0;--text2:#9aa0b8;--text3:#6b7291;
  --accent:#cc1418;--accent2:#a50f12;--accent-glow:rgba(204,20,24,0.2);
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
  --green-bg:rgba(34,197,94,0.20);--yellow-bg:rgba(234,179,8,0.60);
  --red-bg:rgba(239,68,68,0.60);--blue-bg:rgba(59,130,246,0.60);
  --radius:8px;--radius-lg:12px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}
.shell{display:grid;grid-template-rows:58px 1fr;height:100vh;overflow:hidden;}
.topbar{background:#111318;border-bottom:2px solid var(--accent);display:flex;align-items:center;padding:0 16px;gap:0;}
.logo-wrap{display:flex;align-items:center;height:58px;padding-right:20px;border-right:1px solid var(--border2);margin-right:16px;}
.logo-img{height:42px;width:auto;object-fit:contain;}
.app-title{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;line-height:1.3;}
.app-title span{display:block;font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
.topbar-nav{display:flex;gap:2px;margin-left:20px;}
.nav-btn{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .15s;}
.nav-btn:hover{background:var(--bg3);color:var(--text);}
.nav-btn.active{background:var(--accent);color:#fff;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
/* Sync status */
.sync-status{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);font-size:12px;color:var(--text2);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background .3s;}
.sync-dot.online{background:var(--green);box-shadow:0 0 6px var(--green);}
.sync-dot.syncing{background:var(--yellow);animation:pulse .6s infinite;}
.sync-dot.offline{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
/* Online users */
.online-users{display:flex;align-items:center;gap:4px;}
.online-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--bg2);margin-left:-6px;cursor:default;}
.online-avatar:first-child{margin-left:0;}
/* Body */
.body{display:grid;grid-template-columns:220px 1fr;overflow:hidden;height:100%;}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:16px 12px;}
.main{overflow:auto;padding:0;}
/* Sidebar */
.sidebar-section{margin-bottom:20px;}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:0 8px;margin-bottom:8px;}
.mini-cal{background:var(--bg3);border-radius:var(--radius);padding:10px;}
.mini-cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mini-cal-title{font-weight:600;font-size:12px;}
.mini-cal-nav{background:none;border:none;color:var(--text2);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:14px;}
.mini-cal-nav:hover{background:var(--bg4);}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;}
.mini-cal-dow{font-size:9px;color:var(--text3);padding:2px 0;font-weight:600;}
.mini-cal-day{font-size:11px;padding:4px 2px;border-radius:4px;cursor:pointer;color:var(--text2);transition:all .1s;}
.mini-cal-day:hover{background:var(--bg4);color:var(--text);}
.mini-cal-day.today{background:rgba(204,20,24,.2);color:var(--accent);font-weight:700;}
.mini-cal-day.selected{background:var(--accent);color:#fff;font-weight:700;}
.mini-cal-day.empty{visibility:hidden;}
.mini-cal-day.has-data{position:relative;}
.mini-cal-day.has-data::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--green);}
.legend-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.employee-list{display:flex;flex-direction:column;gap:2px;}
.emp-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;}
.emp-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.emp-name{font-size:12px;color:var(--text2);flex:1;}
.emp-status{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
/* Day header */
.day-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;}
.day-nav-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;padding:5px 10px;border-radius:6px;font-size:14px;transition:all .15s;}
.day-nav-btn:hover{border-color:var(--border2);color:var(--text);}
.day-title{font-size:16px;font-weight:700;letter-spacing:-.3px;}
.day-subtitle{font-size:12px;color:var(--text3);}
.day-actions{margin-left:auto;display:flex;gap:8px;}
.action-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;}
.action-btn:hover{border-color:var(--border2);color:var(--text);}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.action-btn.primary:hover{background:var(--accent2);}
/* Plan table */
.plan-wrap{padding:20px 24px;}
.plan-table{width:100%;border-collapse:separate;border-spacing:0;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border);}
.plan-table th{background:var(--bg3);color:var(--text3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:0;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:bottom;}
.plan-table th:first-child{text-align:left;width:120px;padding:0 10px 8px;vertical-align:bottom;}
.plan-table th:nth-child(2){width:80px;padding:0 0 8px;vertical-align:bottom;}
.plan-table td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle;}
.plan-table tr:last-child td{border-bottom:none;}
.plan-table tbody tr:nth-child(even) .site-cell,.plan-table tbody tr:nth-child(even) .vehicle-cell{background:rgba(255,255,255,0.03);}
.plan-table tbody tr:nth-child(even) .emp-cell{background:rgba(255,255,255,0.03);}
.plan-table tbody tr:nth-child(even) .emp-cell.has-assignment{background:rgba(234,179,8,0.55);}
.plan-table tbody tr:nth-child(even) .emp-cell.status-absent{background:rgba(239,68,68,0.60);}
.plan-table tbody tr:nth-child(even) .emp-cell.status-school{background:rgba(59,130,246,0.60);}
.plan-table tbody tr:nth-child(even) .emp-cell.status-half{background:rgba(234,179,8,0.60);}
.site-cell{padding:0 10px;min-height:44px;display:flex;align-items:center;cursor:pointer;}
.site-name{font-size:13px;font-weight:600;color:#fff;}
.site-name-placeholder{font-size:12px;color:var(--text3);font-style:italic;}
.vehicle-cell{padding:4px 8px;text-align:center;}
.vehicle-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:4px;background:var(--bg4);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);transition:all .15s;white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis;}
.vehicle-badge:hover{border-color:var(--accent);color:var(--accent);}
.emp-cell{border-left:1px solid var(--border);text-align:center;min-width:14px;width:14px;padding:4px 2px;cursor:pointer;transition:background .1s;position:relative;}
.emp-cell:hover{background:rgba(204,20,24,0.3);}
.emp-cell.status-absent{background:var(--red-bg);}
.emp-cell.status-half{background:var(--yellow-bg);}
.emp-cell.status-school{background:var(--blue-bg);}
.emp-cell.has-assignment{background:rgba(234,179,8,0.55);}
.emp-cell.status-absent.has-assignment{background:var(--red-bg);}
.emp-cell.status-school.has-assignment{background:var(--blue-bg);}
.emp-cell .cell-mark{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.emp-cell.status-absent .cell-mark{color:#ff6b6b;font-weight:900;}
.emp-cell.status-school .cell-mark{color:#60a5fa;font-weight:900;}
.emp-cell.status-half .cell-mark{color:#fbbf24;font-weight:900;}
.add-row-btn{width:100%;padding:10px;background:transparent;border:none;border-top:1px dashed var(--border);color:var(--text3);cursor:pointer;font-size:12px;transition:all .15s;text-align:center;}
.add-row-btn:hover{background:var(--bg3);color:var(--accent);}
.col-header-wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:4px 2px 4px;height:80px;}
.col-header-name{font-size:11px;white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg);max-height:72px;overflow:hidden;text-overflow:ellipsis;}
/* Context menu */
.ctx-menu{position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:4px;z-index:1000;min-width:185px;box-shadow:0 8px 32px rgba(0,0,0,.6);}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .1s;}
.ctx-item:hover{background:var(--bg3);color:var(--text);}
.ctx-item.active-item{color:var(--text);font-weight:600;}
.ctx-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.ctx-divider{height:1px;background:var(--border);margin:4px 0;}
.ctx-section-label{padding:4px 10px 2px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;min-width:340px;max-width:500px;width:90%;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;}
.modal-input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none;transition:border-color .15s;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.btn-cancel{padding:7px 16px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;}
.btn-confirm{padding:7px 16px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600;}
.btn-danger{background:#b91c1c!important;}
.vehicle-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:240px;overflow-y:auto;margin-top:8px;}
.vehicle-opt{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;text-align:center;}
.vehicle-opt:hover{border-color:var(--accent);color:var(--accent);}
.vehicle-opt.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.status-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.status-opt{padding:8px 10px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:12px;font-weight:600;text-align:center;transition:all .15s;}
.status-opt:hover{filter:brightness(1.2);}
.status-opt.sel{border-color:white;}
.status-opt.s-working{background:var(--green-bg);color:var(--green);}
.status-opt.s-half{background:var(--yellow-bg);color:var(--yellow);}
.status-opt.s-absent{background:var(--red-bg);color:var(--red);}
.status-opt.s-school{background:var(--blue-bg);color:var(--blue);}
/* Employee view */
.emp-view{padding:24px;}
.emp-search-wrap{position:relative;max-width:320px;margin-bottom:24px;}
.emp-search{width:100%;padding:10px 14px 10px 36px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none;}
.emp-search:focus{border-color:var(--accent);}
.emp-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;}
.emp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.emp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;}
.emp-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.emp-card-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.emp-card-name{font-size:14px;font-weight:700;}
.emp-assignments{display:flex;flex-direction:column;gap:6px;}
.emp-assignment{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg3);border-radius:6px;}
.assign-date{font-size:11px;color:var(--text3);min-width:80px;}
.assign-site{font-size:12px;font-weight:500;flex:1;}
.assign-vehicle{font-size:11px;color:var(--text3);}
.assign-tag{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;}
.tag-am{background:var(--yellow-bg);color:var(--yellow);}
.tag-pm{background:var(--blue-bg);color:var(--blue);}
.tag-full{background:var(--green-bg);color:var(--green);}
/* Settings */
.settings-wrap{padding:24px;max-width:680px;}
.settings-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.settings-section-title{font-size:13px;font-weight:700;margin-bottom:14px;}
.settings-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row-name{flex:1;font-size:13px;}
.settings-row-actions{display:flex;gap:6px;}
.settings-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--bg4);color:var(--text3);min-width:20px;text-align:center;}
.btn-sm{padding:4px 10px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;transition:all .15s;}
.btn-sm:hover{color:var(--text);border-color:var(--text3);}
.btn-sm.danger:hover{color:var(--red);border-color:var(--red);}
.drag-handle{cursor:grab;color:var(--text3);font-size:16px;padding:0 4px;user-select:none;}
.drag-handle:active{cursor:grabbing;}
.settings-row.drag-over{border-top:2px solid var(--accent);}
.settings-row.dragging{opacity:.4;}
.btn-add{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--accent);cursor:pointer;font-size:12px;margin-top:10px;transition:all .15s;width:100%;justify-content:center;}
.btn-add:hover{background:var(--accent-glow);}
/* Loader */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;}
.loader-logo{height:60px;}
.loader-text{color:var(--text2);font-size:14px;}
.loader-spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:12px;color:var(--text);z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;animation:slideIn .2s ease;}
.toast.success{border-color:var(--green);}
.toast.error{border-color:var(--red);}
.toast.info{border-color:var(--blue);}
@keyframes slideIn{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px;}
</style>
</head>

  <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px 32px;width:340px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.15)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:22px;font-weight:700;color:var(--text1)">Tagesplanung</div>

    </div>

      <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">E-Mail</label>

        style="width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg1);color:var(--text1);font-size:14px"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>

// ===== PRESENCE =====
function dateKey(d){const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function getDayPlan(d){const k=dateKey(d);if(!state.plans[k])state.plans[k]={sites:[],globalStatus:{}};return state.plans[k];}
function empDates(emp){return (state.employeeDates||{})[emp]||{};}
function isArchivedAsOf(emp,refKey){const a=empDates(emp).austritt;return !!a&&a<=refKey;}
function isNotYetStartedAsOf(emp,refKey){const e=empDates(emp).eintritt;return !!e&&e>refKey;}
function isArchivedEmp(emp){return isArchivedAsOf(emp,dateKey(new Date()));}
function isNotYetStarted(emp){return isNotYetStartedAsOf(emp,dateKey(new Date()));}
function isHiddenEmp(emp){return isArchivedEmp(emp)||isNotYetStarted(emp);}
function fmtDate(k){if(!k)return'';const[y,m,d]=k.split('-');return d+'.'+m+'.'+y;}

function setupPresence(name) {
  const presRef = db.ref('presence/' + state.myId);
  const col = COLORS[Math.floor(Math.random()*COLORS.length)];
  presRef.set({ name, color: col, online: true, ts: Date.now() });
  presRef.onDisconnect().remove();
  db.ref('presence').on('value', snap => {
    const users = snap.val() || {};
    renderOnlineUsers(users);
  });
}

function renderOnlineUsers(users) {
  const el = document.getElementById('onlineUsers');
  const others = Object.entries(users).filter(([id]) => id !== state.myId);
  if (others.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = others.slice(0,5).map(([id, u]) => {
    const init = u.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<div class="online-avatar" style="background:${u.color}33;color:${u.color};border-color:${u.color}" title="${u.name} ist online">${init}</div>`;
  }).join('') + (others.length > 0 ? `<span style="font-size:11px;color:var(--text3);margin-left:6px">${others.length} online</span>` : '');
}

// ===== SYNC STATUS =====
let syncTimeout;
function setSyncing() {
  document.getElementById('syncDot').className = 'sync-dot syncing';
  document.getElementById('syncLabel').textContent = 'Speichert…';
  clearTimeout(syncTimeout);
}
function setSynced() {
  document.getElementById('syncDot').className = 'sync-dot online';
  document.getElementById('syncLabel').textContent = 'Gespeichert ✓';
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    document.getElementById('syncLabel').textContent = 'Online';
  }, 2000);
}
function setOffline() {
  document.getElementById('syncDot').className = 'sync-dot offline';
  document.getElementById('syncLabel').textContent = 'Offline';
}

// ===== FIREBASE WRITE (debounced) =====
let writeTimers = {};
function fbWrite(path, value, delay=400) {
  setSyncing();
  clearTimeout(writeTimers[path]);
  writeTimers[path] = setTimeout(() => {
    db.ref(path).set(value)
      .then(setSynced)
      .catch(e => { setOffline(); showToast('Fehler: ' + e.message, 'error'); });
  }, delay);
}

// ===== FIREBASE LISTENERS =====
function setupListeners() {
  // Plans
  db.ref('plans').on('value', snap => {
    state.plans = snap.val() || {};
    if (state.view === 'plan') renderPlanView();
    renderSidebar();
  });
  // Settings (employees + vehicles)
  db.ref('settings').on('value', snap => {
    const s = snap.val();
    if (s) {
      if (s.employees) state.employees = s.employees;
      if (s.vehicles) state.vehicles = s.vehicles;
      if (s.inactiveEmployees) state.inactiveEmployees = s.inactiveEmployees;
      else state.inactiveEmployees = [];
      if (s.employeeDates) state.employeeDates = s.employeeDates;
      else state.employeeDates = {};
    }
    render();
  });
  // Template
  db.ref('template').on('value', function(snap) {
    if (snap.val()) state.template = snap.val();
  });
  // Connection state
  db.ref('.info/connected').on('value', snap => {
    if (snap.val()) { setSynced(); } else { setOffline(); }
  });
}

function startApp(user) {
  state.myName = user.displayName || user.email.split('@')[0];

function doLogin() {

// ===== VIEW =====

function applyTemplate() {
  var plan = getDayPlan(state.selectedDate);
  var tmpl = state.template;
  if (!tmpl || !tmpl.sites || tmpl.sites.length === 0) {
    showToast('Noch keine Vorlage gespeichert. Bitte zuerst einen Tag als Vorlage speichern.', 'error');
    return;
  }
  if (plan.sites && plan.sites.length > 0) {
    if (!confirm('Der aktuelle Tag hat bereits Einträge. Vorlage trotzdem anwenden?')) return;
  }
  plan.sites = tmpl.sites.map(function(s) {
    return { id: 's'+Date.now()+Math.random(), name: s.name||'', vehicle: s.vehicle||null, assignments: {} };
  });
  if (!plan.globalStatus) plan.globalStatus = {};
  fbWrite('plans/'+dateKey(state.selectedDate), plan);
  showToast('Vorlage angewendet', 'success');
}

function saveAsTemplate() {
  var plan = getDayPlan(state.selectedDate);
  if (!plan.sites || plan.sites.length === 0) {
    showToast('Dieser Tag hat keine Baustellen', 'error'); return;
  }
  var tmpl = {
    sites: plan.sites.map(function(s) {
      return { vehicle: s.vehicle||null, name: s.name||'' };
    })
  };
  state.template = tmpl;
  db.ref('template').set(tmpl).then(function() {
    showToast('✓ Vorlage gespeichert (' + tmpl.sites.length + ' Baustellen)', 'success');
  });
}

function setView(v){state.view=v;document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',['plan','employees','settings'][i]===v));render();}
function render(){renderSidebar();if(state.view==='plan')renderPlanView();else if(state.view==='employees')renderEmployeeView();else renderSettingsView();}

function renderSidebar(){
  renderMiniCal();
  const el=document.getElementById('sidebarEmployees');
  const plan=getDayPlan(state.selectedDate);
  const allEmps=state.employees;
  el.innerHTML=allEmps.map((emp,i)=>{
    const isInactive=(state.inactiveEmployees||[]).includes(emp)||isHiddenEmp(emp);
    if(isInactive)return '';
    const gs=plan.globalStatus?.[emp];
    const sc=gs==='absent'?'var(--red)':gs==='school'?'var(--blue)':gs==='half'?'var(--yellow)':'var(--green)';
    const init=emp.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  }).join('');

function renderMiniCal(){
  const d=state.currentDate,y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=new Date();
  const months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  let html=`<div class="mini-cal-header"><button class="mini-cal-nav" onclick="changeMonth(-1)">‹</button><span class="mini-cal-title">${months[m]} ${y}</span><button class="mini-cal-nav" onclick="changeMonth(1)">›</button></div><div class="mini-cal-grid">`;
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(dw=>html+=`<div class="mini-cal-dow">${dw}</div>`);
  const start=first===0?6:first-1;
  for(let i=0;i<start;i++)html+=`<div class="mini-cal-day empty">x</div>`;
  for(let i=1;i<=days;i++){
    const dd=new Date(y,m,i),k=dateKey(dd);
    const isToday=dateKey(today)===k,isSel=dateKey(state.selectedDate)===k;
    const hasData=state.plans[k]&&state.plans[k].sites&&state.plans[k].sites.length>0;
    let cls='mini-cal-day';if(isToday)cls+=' today';if(isSel)cls+=' selected';if(hasData&&!isSel)cls+=' has-data';
    html+=`<div class="${cls}" onclick="selectDate(${y},${m},${i})">${i}</div>`;
  }
  document.getElementById('miniCal').innerHTML=html+'</div>';
}

function changeMonth(dir){state.currentDate=new Date(state.currentDate.getFullYear(),state.currentDate.getMonth()+dir,1);renderMiniCal();}
function selectDate(y,m,d){state.selectedDate=new Date(y,m,d);render();}

// ===== PLAN VIEW =====
function renderPlanView(){
  const d=state.selectedDate,plan=getDayPlan(d);
  const days=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const refKey=dateKey(d);
  const allActive=state.employees.filter(e=>!(state.inactiveEmployees||[]).includes(e)&&!isArchivedAsOf(e,refKey)&&!isNotYetStartedAsOf(e,refKey));
  const dayNames=new Set();
  Object.keys(plan.globalStatus||{}).forEach(n=>dayNames.add(n));
  (plan.sites||[]).forEach(site=>Object.keys(site.assignments||{}).forEach(n=>dayNames.add(n)));
  const historical=[...dayNames].filter(n=>!allActive.includes(n));
  const allColumns=allActive.concat(historical);
  const activeEmployees=state.empFilter?allColumns.filter(e=>e===state.empFilter):allColumns;
  let empHeaders=activeEmployees.map((emp,i)=>{
    const gs=plan.globalStatus?.[emp]||'';
    const sc=gs==='absent'?'var(--red)':gs==='school'?'var(--blue)':gs==='half'?'var(--yellow)':'var(--green)';
    const isHist=historical.includes(emp);
    return `<th style="cursor:pointer${isHist?';opacity:.55':''}" onclick="openStatusModal('${emp.replace(/'/g,"\\'")}')"><div class="col-header-wrap"><div class="col-header-name" title="${emp}${isHist?' (nicht mehr aktiv)':''}">${emp}</div><div style="width:8px;height:8px;border-radius:50%;background:${sc};margin:0 auto"></div></div></th>`;
  }).join('');
  let rows=(plan.sites||[]).map(site=>{
    const vIdx=site.vehicle?site.vehicle-1:-1;
    const vName=vIdx>=0?(state.vehicles[vIdx]||'—'):'—';
    const empCells=activeEmployees.map(emp=>{
      const gs=plan.globalStatus?.[emp]||'';
      const a=site.assignments?.[emp]||'';
      let cls='emp-cell';let mark='';
      if(gs==='absent'){cls+=' status-absent';mark=a?`<span class="cell-mark">${a}</span>`:`<span class="cell-mark" style="opacity:.3">—</span>`;}
      else if(gs==='school'){cls+=' status-school';mark=a?`<span class="cell-mark">${a}</span>`:`<span class="cell-mark" style="opacity:.3">S</span>`;}
      else if(gs==='half'){cls+=' status-half'+(a?' has-assignment':'');mark=a?`<span class="cell-mark">${a}</span>`:'';}
      else{cls+=' status-working'+(a?' has-assignment':'');mark=a?`<span class="cell-mark">${a}</span>`:'';}
      return `<td class="${cls}" onclick="cycleAssignment('${site.id}','${emp.replace(/'/g,"\\'")}',event)" oncontextmenu="openCellMenu(event,'${site.id}','${emp.replace(/'/g,"\\'")}')"><center>${mark}</center></td>`;
    }).join('');
    return `<tr><td><div class="site-cell" onclick="editSite('${site.id}')"><span class="site-name">${site.name||'<span class="site-name-placeholder">Baustelle…</span>'}</span></div></td><td class="vehicle-cell"><span class="vehicle-badge" onclick="pickVehicle('${site.id}')">${vName}</span></td>${empCells}</tr>`;
  }).join('');
  document.getElementById('mainContent').innerHTML=`
    <div class="day-header">
      <button class="day-nav-btn" onclick="changeDay(-1)">‹</button>
      <button class="day-nav-btn" onclick="goToday()" title="Heute" style="font-size:11px;padding:5px 10px;">Heute</button>
      <div><div class="day-title">${days[d.getDay()]}</div><div class="day-subtitle">${d.getDate()}. ${months[d.getMonth()]} ${d.getFullYear()}</div></div>
      <button class="day-nav-btn" onclick="changeDay(1)">›</button>
      <div class="day-actions">
        <button class="action-btn" onclick="saveAsTemplate()">💾 Als Vorlage speichern</button>
        <button class="action-btn" onclick="applyTemplate()">📄 Vorlage anwenden</button>
        <button class="action-btn" onclick="copyPrevDay()">📋 Vortag kopieren</button>
        <button class="action-btn" onclick="clearDay()">🗑 Tag leeren</button>
        <button class="action-btn primary" onclick="addSite()">+ Baustelle</button>
      </div>
    </div>
    <div class="plan-wrap">
      <table class="plan-table">
        <thead><tr><th style="text-align:left">Baustelle</th><th>Fahrzeug</th>${empHeaders}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <button class="add-row-btn" onclick="addSite()">+ Baustelle hinzufügen</button>
    </div>`;
}

function toggleEmpFilter(emp){state.empFilter=state.empFilter===emp?null:emp;renderSidebar();renderPlanView();}

function goToday(){state.selectedDate=new Date();state.currentDate=new Date();render();showToast('Heute','success');}
function changeDay(dir){const d=new Date(state.selectedDate);d.setDate(d.getDate()+dir);state.selectedDate=d;state.currentDate=new Date(d.getFullYear(),d.getMonth(),1);render();}

// ===== MUTATIONS (write to Firebase) =====
function cycleAssignment(siteId,emp,e){
  e.stopPropagation();
  const plan=getDayPlan(state.selectedDate);
  const site=plan.sites.find(s=>s.id===siteId);if(!site)return;
  if(!site.assignments)site.assignments={};
  const cur=site.assignments[emp]||'';
  const cycle=['','X','X1','X2'];
  const next=cycle[(cycle.indexOf(cur)+1)%cycle.length];
  if(next==='')delete site.assignments[emp];else site.assignments[emp]=next;
  fbWrite('plans/'+dateKey(state.selectedDate), getDayPlan(state.selectedDate));
}

function setAssignment(siteId,emp,val){
  const plan=getDayPlan(state.selectedDate);
  const site=plan.sites.find(s=>s.id===siteId);if(!site)return;
  if(!site.assignments)site.assignments={};
  if(val==='')delete site.assignments[emp];else site.assignments[emp]=val;
  fbWrite('plans/'+dateKey(state.selectedDate), getDayPlan(state.selectedDate));
  closeCtx();
}

function setGlobalStatus(emp,status){
  const plan=getDayPlan(state.selectedDate);
  if(!plan.globalStatus)plan.globalStatus={};
  if(status==='')delete plan.globalStatus[emp];else plan.globalStatus[emp]=status;
  if(status==='absent'){(plan.sites||[]).forEach(site=>{if(site.assignments)delete site.assignments[emp];});}
  fbWrite('plans/'+dateKey(state.selectedDate), getDayPlan(state.selectedDate));
  closeCtx();closeModal();
}

function editSite(siteId){
  const plan=getDayPlan(state.selectedDate);
  const site=plan.sites.find(s=>s.id===siteId);
  const saveSite=()=>{
    site.name=document.getElementById('siteName').value;
    fbWrite('plans/'+dateKey(state.selectedDate),getDayPlan(state.selectedDate));
    closeModal();
  };
  showModal({title:'Baustelle bearbeiten',content:`<input class="modal-input" id="siteName" value="${site.name||''}" placeholder="Baustellenname">`,
    actions:[{label:'Löschen',action:()=>deleteSite(siteId),danger:true},{label:'Abbrechen',cancel:true},{label:'Speichern',action:saveSite,primary:true}]});
  setTimeout(()=>{const inp=document.getElementById('siteName');if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveSite();});}},50);
}

function deleteSite(siteId){
  const plan=getDayPlan(state.selectedDate);
  plan.sites=plan.sites.filter(s=>s.id!==siteId);
  fbWrite('plans/'+dateKey(state.selectedDate),plan);
  closeModal();
  renderPlanView();
}

function pickVehicle(siteId){
  const plan=getDayPlan(state.selectedDate),site=plan.sites.find(s=>s.id===siteId);
  const opts=state.vehicles.map((v,i)=>`<div class="vehicle-opt${site.vehicle===i+1?' sel':''}" onclick="selVehicle('${siteId}',${i+1})">${v}</div>`).join('');
  showModal({title:'Fahrzeug auswählen',content:`<div class="vehicle-grid">${opts}</div>`,
    actions:[{label:'Kein Fahrzeug',action:()=>{site.vehicle=null;fbWrite('plans/'+dateKey(state.selectedDate),getDayPlan(state.selectedDate));closeModal();}},{label:'Abbrechen',cancel:true}]});
}
function selVehicle(siteId,vIdx){
  const plan=getDayPlan(state.selectedDate),site=plan.sites.find(s=>s.id===siteId);
  site.vehicle=vIdx;fbWrite('plans/'+dateKey(state.selectedDate),getDayPlan(state.selectedDate));closeModal();
}

function addSite(){
  const plan=getDayPlan(state.selectedDate);
  if(!plan.sites)plan.sites=[];
  plan.sites.push({id:'s'+Date.now(),name:'',vehicle:null,assignments:{}});
  fbWrite('plans/'+dateKey(state.selectedDate),plan);
}

function copyPrevDay(){
  const prev=new Date(state.selectedDate);prev.setDate(prev.getDate()-1);
  const pp=state.plans[dateKey(prev)];
  if(!pp||!pp.sites||pp.sites.length===0){showToast('Kein Plan für Vortag','error');return;}
  const copy=JSON.parse(JSON.stringify(pp));
  copy.sites=copy.sites.map(s=>({...s,id:'s'+Date.now()+Math.random()}));
  state.plans[dateKey(state.selectedDate)]=copy;
  fbWrite('plans/'+dateKey(state.selectedDate),copy);
  showToast('Vortag kopiert','success');
}

function clearDay(){
  const empty={sites:[],globalStatus:{}};
  state.plans[dateKey(state.selectedDate)]=empty;
  fbWrite('plans/'+dateKey(state.selectedDate),empty);
  showToast('Tag geleert','success');
}

// ===== EMPLOYEE VIEW =====
function renderEmployeeView(){
  document.getElementById('mainContent').innerHTML=`<div class="emp-view">
    <div style="margin-bottom:20px"><h2 style="font-size:16px;font-weight:700;margin-bottom:4px">Mitarbeiter-Ansicht</h2><p style="font-size:12px;color:var(--text2)">Einsätze der nächsten 14 Tage</p></div>
    <div class="emp-search-wrap"><span class="emp-search-icon">🔍</span><input class="emp-search" id="empSearch" placeholder="Mitarbeiter suchen..." oninput="filterEmpView()"></div>
    <div class="emp-cards" id="empCards"></div></div>`;
  renderEmpCards('');
}
function filterEmpView(){renderEmpCards(document.getElementById('empSearch')?.value||'');}
function renderEmpCards(filter){
  const visible=state.employees.filter(e=>!isHiddenEmp(e));
  const emps=filter?visible.filter(e=>e.toLowerCase().includes(filter.toLowerCase())):visible;
  const now=new Date(),days=['So','Mo','Di','Mi','Do','Fr','Sa'],months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const el=document.getElementById('empCards');if(!el)return;
  el.innerHTML=emps.map(emp=>{
    const i=state.employees.indexOf(emp),col=COLORS[i%COLORS.length];
    const init=emp.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    let assignments=[];
    for(let dd=0;dd<14;dd++){
      const dt=new Date(now);dt.setDate(dt.getDate()+dd);
      const k=dateKey(dt),plan=state.plans[k];if(!plan)continue;
      const gs=plan.globalStatus?.[emp];
      if(gs==='absent'){assignments.push({date:dt,type:'absent',site:'Abwesend',vehicle:''});continue;}
      if(gs==='school'){assignments.push({date:dt,type:'school',site:'Schule',vehicle:''});continue;}
      (plan.sites||[]).forEach(site=>{
        const a=site.assignments?.[emp];
        if(a){const vName=site.vehicle?(state.vehicles[site.vehicle-1]||''):'';assignments.push({date:dt,type:a==='X1'?'am':a==='X2'?'pm':'full',site:site.name,vehicle:vName});}
      });
    }
    const aHtml=assignments.length===0?`<div style="color:var(--text3);font-size:12px;padding:8px">Keine Einsätze in 14 Tagen</div>`:assignments.map(a=>{
      const tag=a.type==='am'?'tag-am':a.type==='pm'?'tag-pm':a.type==='absent'?'tag-am':a.type==='school'?'tag-pm':'tag-full';
      const lbl=a.type==='am'?'VM':a.type==='pm'?'NM':a.type==='absent'?'ABS':a.type==='school'?'SCH':'';
      return `<div class="emp-assignment"><span class="assign-date">${days[a.date.getDay()]} ${a.date.getDate()}. ${months[a.date.getMonth()]}</span><span class="assign-site">${a.site}</span><span class="assign-vehicle">${a.vehicle}</span>${lbl?`<span class="assign-tag ${tag}">${lbl}</span>`:''}</div>`;
    }).join('');
    return `<div class="emp-card"><div class="emp-card-header"><div class="emp-card-avatar" style="background:${col}33;color:${col}">${init}</div><div><div class="emp-card-name">${emp}</div><div style="font-size:11px;color:var(--text3)">${assignments.length} Einsatz${assignments.length!==1?'e':''} (14 Tage)</div></div></div><div class="emp-assignments">${aHtml}</div></div>`;
  }).join('');
}

// ===== SETTINGS =====
let dragSrcIdx=null,dragType=null;
function renderSettingsView(){
  const visibleIdx=state.employees.map((e,i)=>i).filter(i=>!isHiddenEmp(state.employees[i]));
  const archivedIdx=state.employees.map((e,i)=>i).filter(i=>isArchivedEmp(state.employees[i]));
  const upcomingIdx=state.employees.map((e,i)=>i).filter(i=>isNotYetStarted(state.employees[i]));
  const empRows=visibleIdx.map(i=>{
    const e=state.employees[i];
    const col=COLORS[i%COLORS.length];const init=e.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const isInactive=(state.inactiveEmployees||[]).includes(e);
    const d=empDates(e);
    const dateInfo=[d.eintritt?`Eintritt ${fmtDate(d.eintritt)}`:'',d.austritt?`Austritt geplant: ${fmtDate(d.austritt)}`:''].filter(Boolean).join(' · ');
    return `<div class="settings-row" draggable="true" data-idx="${i}" ondragstart="dragStart(event,'emp',${i})" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropItem(event,'emp',${i})">
      <span class="drag-handle">⠿</span>
      <div style="width:26px;height:26px;border-radius:50%;background:${col}33;color:${col};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${init}</div>
      <div class="settings-row-name">${e}${isInactive?'<span style="font-size:10px;margin-left:8px;padding:2px 6px;border-radius:4px;background:var(--red-bg);color:var(--red)">Inaktiv</span>':''}${dateInfo?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${dateInfo}</div>`:''}</div>
      <div class="settings-row-actions"><button class="btn-sm" onclick="renameEmp(${i})">Umbenennen</button>${isInactive?'<button class="btn-sm" style="color:var(--green)" onclick="reactivateEmp('+i+')">✓ Reaktivieren</button>':'<button class="btn-sm danger" onclick="deactivateEmp('+i+')">Deaktivieren</button>'}<button class="btn-sm" onclick="openDatesModal(${i})">Ein-/Austritt</button></div>
    </div>`;
  }).join('');
  const archivedRows=archivedIdx.map(i=>{
    const e=state.employees[i];
    const col=COLORS[i%COLORS.length];const init=e.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const d=empDates(e);
    return `<div class="settings-row">
      <div style="width:26px;height:26px;border-radius:50%;background:${col}33;color:${col};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;opacity:.6">${init}</div>
      <div class="settings-row-name" style="opacity:.6">${e}<div style="font-size:10px;color:var(--text3);margin-top:2px">${d.eintritt?`Eintritt ${fmtDate(d.eintritt)} · `:''}Austritt ${fmtDate(d.austritt)}</div></div>
      <div class="settings-row-actions"><button class="btn-sm" style="color:var(--green)" onclick="reactivateEmp(${i})">✓ Reaktivieren</button></div>
    </div>`;
  }).join('');
  const archivedSection=archivedIdx.length?`<div class="settings-section" style="margin-top:16px">
    <div class="settings-section-title" style="cursor:pointer;display:flex;align-items:center;gap:6px" onclick="toggleArchived()">${state.showArchived?'▾':'▸'} Archiviert (${archivedIdx.length}) <span style="font-size:11px;font-weight:400;color:var(--text3)">– zählt nicht mehr zu den Mitarbeitern, vergangene Einsätze bleiben sichtbar</span></div>
    ${state.showArchived?archivedRows:''}
  </div>`:'';
  const upcomingRows=upcomingIdx.map(i=>{
    const e=state.employees[i];
    const col=COLORS[i%COLORS.length];const init=e.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const d=empDates(e);
    return `<div class="settings-row">
      <div style="width:26px;height:26px;border-radius:50%;background:${col}33;color:${col};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${init}</div>
      <div class="settings-row-name">${e}<div style="font-size:10px;color:var(--text3);margin-top:2px">Eintritt ab ${fmtDate(d.eintritt)}</div></div>
      <div class="settings-row-actions"><button class="btn-sm" onclick="renameEmp(${i})">Umbenennen</button><button class="btn-sm" onclick="openDatesModal(${i})">Ein-/Austritt</button></div>
    </div>`;
  }).join('');
  const upcomingSection=upcomingIdx.length?`<div class="settings-section" style="margin-top:16px">
    <div class="settings-section-title" style="cursor:pointer;display:flex;align-items:center;gap:6px" onclick="toggleUpcoming()">${state.showUpcoming?'▾':'▸'} Bevorstehend (${upcomingIdx.length}) <span style="font-size:11px;font-weight:400;color:var(--text3)">– zählt erst ab Eintrittsdatum mit, erscheint dann automatisch</span></div>
    ${state.showUpcoming?upcomingRows:''}
  </div>`:'';
  const vehRows=state.vehicles.map((v,i)=>`<div class="settings-row" draggable="true" ondragstart="dragStart(event,'veh',${i})" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropItem(event,'veh',${i})">
    <span class="drag-handle">⠿</span><span class="settings-tag">${i+1}</span>
    <div class="settings-row-name">${v}</div>
    <div class="settings-row-actions"><button class="btn-sm" onclick="renameVeh(${i})">Umbenennen</button><button class="btn-sm danger" onclick="removeVeh(${i})">Entfernen</button></div>
  </div>`).join('');
  document.getElementById('mainContent').innerHTML=`<div class="settings-wrap">
    <h2 style="font-size:16px;font-weight:700;margin-bottom:20px">Einstellungen</h2>
    <div class="settings-section"><div class="settings-section-title">Mitarbeiter (${visibleIdx.length}) <span style="font-size:11px;font-weight:400;color:var(--text3)">– Drag & Drop zum Sortieren</span></div>${empRows}<button class="btn-add" onclick="addEmp()">+ Mitarbeiter hinzufügen</button></div>
    ${upcomingSection}
    ${archivedSection}
    <div class="settings-section"><div class="settings-section-title">Fahrzeuge (${state.vehicles.length})</div>${vehRows}<button class="btn-add" onclick="addVeh()">+ Fahrzeug hinzufügen</button></div>
  </div>`;
}

function saveSettings(){fbWrite('settings',{employees:state.employees,vehicles:state.vehicles,inactiveEmployees:state.inactiveEmployees||[],employeeDates:state.employeeDates||{}},100);}
function toggleArchived(){state.showArchived=!state.showArchived;renderSettingsView();}
function toggleUpcoming(){state.showUpcoming=!state.showUpcoming;renderSettingsView();}
function dragStart(e,type,idx){dragSrcIdx=idx;dragType=type;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dropItem(e,type,toIdx){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragType!==type||dragSrcIdx===toIdx||dragSrcIdx===null)return;
  if(type==='emp'){const a=state.employees.splice(dragSrcIdx,1)[0];state.employees.splice(toIdx,0,a);}
  else{const a=state.vehicles.splice(dragSrcIdx,1)[0];state.vehicles.splice(toIdx,0,a);}
  dragSrcIdx=null;dragType=null;saveSettings();showToast('Reihenfolge gespeichert','success');
}
function renameEmp(i){showModal({title:'Umbenennen',content:`<input class="modal-input" id="nn" value="${state.employees[i]}">`,actions:[{label:'Abbrechen',cancel:true},{label:'Speichern',primary:true,action:()=>{const v=document.getElementById('nn').value.trim();if(v){state.employees[i]=v;saveSettings();closeModal();}}}]});setTimeout(()=>document.getElementById('nn')?.focus(),50);}
function deactivateEmp(i){
  const emp=state.employees[i];
  showModal({title:'Mitarbeiter deaktivieren',
    content:`<p style="color:var(--text2)">Soll <strong>${emp}</strong> deaktiviert werden?<br><br>Der Mitarbeiter verschwindet aus der Planung, aber alle vergangenen Einträge bleiben erhalten und sichtbar.</p>`,
    actions:[{label:'Abbrechen',cancel:true},{label:'Deaktivieren',danger:true,action:()=>{
      if(!state.inactiveEmployees)state.inactiveEmployees=[];
      if(!state.inactiveEmployees.includes(emp))state.inactiveEmployees.push(emp);
      saveSettings();closeModal();showToast(emp+' deaktiviert','success');
    }}]});
}
function reactivateEmp(i){
  const emp=state.employees[i];
  state.inactiveEmployees=(state.inactiveEmployees||[]).filter(e=>e!==emp);
  if(state.employeeDates&&state.employeeDates[emp])delete state.employeeDates[emp].austritt;
  saveSettings();showToast(emp+' reaktiviert','success');renderSettingsView();
}
function openDatesModal(i){
  const emp=state.employees[i];
  const d=empDates(emp);
  showModal({title:'Ein-/Austritt: '+emp,
    content:`<label style="font-size:12px;color:var(--text2);display:block;margin-bottom:4px">Eintrittsdatum</label>
    <input type="date" class="modal-input" id="dEin" value="${d.eintritt||''}">
    <label style="font-size:12px;color:var(--text2);display:block;margin:12px 0 4px">Austrittsdatum</label>
    <input type="date" class="modal-input" id="dAus" value="${d.austritt||''}">
    <p style="font-size:11px;color:var(--text3);margin-top:10px">Liegt das Eintrittsdatum in der Zukunft, erscheint der Mitarbeiter erst ab diesem Tag automatisch. Ist das Austrittsdatum erreicht, wird er automatisch archiviert (zählt nicht mehr mit, vergangene Einsätze bleiben sichtbar).</p>`,
    actions:[{label:'Abbrechen',cancel:true},{label:'Speichern',primary:true,action:()=>{
      const ein=document.getElementById('dEin').value;
      const aus=document.getElementById('dAus').value;
      if(!state.employeeDates)state.employeeDates={};
      const rec={};
      if(ein)rec.eintritt=ein;
      if(aus)rec.austritt=aus;
      state.employeeDates[emp]=rec;
      saveSettings();closeModal();renderSettingsView();
      const today=dateKey(new Date());
      const msg=aus&&aus<=today?emp+' archiviert':ein&&ein>today?emp+' als bevorstehend erfasst':'Daten gespeichert';
      showToast(msg,'success');
    }}]});
}
function addEmp(){showModal({title:'Mitarbeiter hinzufügen',content:`<input class="modal-input" id="nn" placeholder="Name">`,actions:[{label:'Abbrechen',cancel:true},{label:'Hinzufügen',primary:true,action:()=>{const v=document.getElementById('nn').value.trim();if(v){state.employees.push(v);if(!state.employeeDates)state.employeeDates={};state.employeeDates[v]={eintritt:dateKey(new Date())};saveSettings();closeModal();}}}]});setTimeout(()=>document.getElementById('nn')?.focus(),50);}
function renameVeh(i){showModal({title:'Fahrzeug umbenennen',content:`<input class="modal-input" id="nn" value="${state.vehicles[i]}">`,actions:[{label:'Abbrechen',cancel:true},{label:'Speichern',primary:true,action:()=>{const v=document.getElementById('nn').value.trim();if(v){state.vehicles[i]=v;saveSettings();closeModal();}}}]});setTimeout(()=>document.getElementById('nn')?.focus(),50);}
function removeVeh(i){state.vehicles.splice(i,1);saveSettings();renderSettingsView();}
function addVeh(){showModal({title:'Fahrzeug hinzufügen',content:`<input class="modal-input" id="nn" placeholder="Fahrzeugname">`,actions:[{label:'Abbrechen',cancel:true},{label:'Hinzufügen',primary:true,action:()=>{const v=document.getElementById('nn').value.trim();if(v){state.vehicles.push(v);saveSettings();closeModal();}}}]});setTimeout(()=>document.getElementById('nn')?.focus(),50);}

// ===== MODAL / CTX =====
function showModal({title,content,actions}){
  const box=document.getElementById('modalBox');
  const btns=actions.map(a=>`<button class="${a.cancel?'btn-cancel':'btn-confirm'}${a.danger?' btn-danger':''}" id="mBtn${a.label.replace(/\s/g,'')}">${a.label}</button>`).join('');
  box.innerHTML=`<div class="modal-title">${title}</div>${content}<div class="modal-actions">${btns}</div>`;
  document.getElementById('modalOverlay').style.display='flex';
  actions.forEach(a=>{const btn=document.getElementById('mBtn'+a.label.replace(/\s/g,''));if(btn){if(a.cancel)btn.onclick=closeModal;else if(a.action)btn.onclick=a.action;}});
}
function closeModal(){document.getElementById('modalOverlay').style.display='none';}
function closeCtx(){document.getElementById('ctxMenu').style.display='none';}
document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))closeCtx();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeCtx();}});

function showToast(msg,type='success'){
  const el=document.getElementById('toastEl');
  el.className='toast '+(type||'');el.textContent=msg;el.style.display='flex';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2800);
}
</script>
</body>
</html>
